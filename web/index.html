<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ship.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargonex — AI Decision Platform for SAIL Shipping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/veronica.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDCK9aZi_p45uDhnZYCnoKgsctRkuWc20A",
        authDomain: "cargonex-53107.firebaseapp.com",
        projectId: "cargonex-53107",
        storageBucket: "cargonex-53107.firebasestorage.app",
        messagingSenderId: "254122945542",
        appId: "1:254122945542:web:25c0e2960ad8b8dc46a787"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      window.loginWithGoogle = function() {
        return signInWithPopup(auth, provider);
      };

      window.logoutFirebase = function() {
        return signOut(auth);
      };
    </script>
  </body>
</html>
