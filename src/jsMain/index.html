<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veronica</title>
</head>
<body>
    <!-- Ye wo div hai jisme aapka Kotlin/React app load hoga -->
    <div id="root"></div>

    <!-- Firebase SDK Setup -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
      import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

      // YAHAN APNI FIREBASE CONFIG PASTE KAREIN (Firebase Console -> General Settings se)
      const firebaseConfig = {
        apiKey: "AIzaSyDCK9aZi_p45uDhnZYCnoKgsctRkuWc20A",
        authDomain: "cargonex-53107.firebaseapp.com",
        projectId: "cargonex-53107",
        storageBucket: "cargonex-53107.firebasestorage.app",
        messagingSenderId: "254122945542",
        appId: "1:254122945542:web:25c0e2960ad8b8dc46a787"
      };

      // Firebase Initialize
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      // Kotlin code ke liye functions expose kar rahe hain
      window.loginWithGoogle = function() {
        return signInWithPopup(auth, provider);
      };
      
      window.logoutFirebase = function() {
        return signOut(auth);
      };
    </script>
</body>
</html>
